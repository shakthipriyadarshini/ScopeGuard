{% extends "base.html" %}
{% block title %}Sign In — ScopeGuard{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-2xl font-bold text-center text-gray-800 mb-8">Sign in to ScopeGuard</h1>

  <form method="POST" action="/login"
        class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-5">

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input id="email" name="email" type="email" required autofocus
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input id="password" name="password" type="password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium
                   rounded-lg py-2 text-sm transition-colors">
      Sign in
    </button>
  </form>

  <!-- Demo credentials hint (remove before production) -->
  <p class="text-center text-xs text-gray-400 mt-4">
    Demo: demo@scopeguard.test / demo1234
  </p>
</div>
{% endblock %}
