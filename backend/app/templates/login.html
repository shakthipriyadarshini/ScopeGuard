{% extends "base.html" %}
{% block title %}Log in - ScopeGuard{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-bold mb-4">Log in</h1>

  {% if error %}
    <p class="mb-4 text-sm text-red-600">{{ error }}</p>
  {% endif %}

  <form method="post" class="space-y-3">
    <input type="email" name="email" placeholder="Email" required
           class="w-full border rounded px-3 py-2">
    <input type="password" name="password" placeholder="Password" required
           class="w-full border rounded px-3 py-2">
    <button class="w-full bg-blue-600 text-white rounded py-2 hover:bg-blue-700">Log in</button>
  </form>
</div>
{% endblock %}
